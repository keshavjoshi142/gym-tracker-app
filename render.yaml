version: "1"
services:
  - type: web
    name: gymtracker-frontend
    env: node
    buildCommand: npm install && npm run build:web
    startCommand: npx serve dist -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXPO_PUBLIC_API_URL
        value: https://gymtracker-api.onrender.com
        
  - type: web
    name: gymtracker-api
    env: node
    rootDir: ./server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://gymtracker-frontend.onrender.com