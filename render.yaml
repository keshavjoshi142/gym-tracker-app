    name: gymtracker-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymtracker_doqc
          property: postgresql://keshav:jyKg9o5u1c4UUCxuTLkGA4p4jkEw1kli@dpg-d5tgriruibrs73dmbf1g-a/gymtracker_doqc
        
  - type: static
    name: gymtracker-web
    env: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://gymtracker-api.onrender.com
      - key: EXPO_PUBLIC_ENVIRONMENT
        value: production

