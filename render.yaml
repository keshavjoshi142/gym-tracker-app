version: "1"
services:
  - type: web
    name: gymtracker-api
    env: node
    rootDir: ./server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
        
  - type: static
    name: gymtracker-web
    env: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://gymtracker-api.onrender.com
      - key: EXPO_PUBLIC_ENVIRONMENT
        value: production