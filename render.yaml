version: "1"
services:
  # Backend API Service
  - type: web
    name: gymtracker-api
    env: node
    buildCommand: cd server && npm install && npm run migrate
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gymtracker-db
          property: connectionString
        
  # Frontend Static Site
  - type: static
    name: gymtracker-web
    env: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://gymtracker-api.onrender.com
      - key: EXPO_PUBLIC_ENVIRONMENT
        value: production

databases:
  - name: gymtracker-db
    databaseName: gymtracker_prod
    user: gymtracker_user